services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: deskbrawl
      POSTGRES_PASSWORD: deskbrawl_local
      POSTGRES_DB: deskbrawl
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskbrawl -d deskbrawl"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres:
