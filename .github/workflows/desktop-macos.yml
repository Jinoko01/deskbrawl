name: Build macOS installer

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-macos.yml'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies and test the desktop app
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          pnpm --filter '@deskbrawl/desktop...' install --frozen-lockfile
          pnpm --filter @deskbrawl/desktop lint
          pnpm --filter @deskbrawl/desktop test
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build the universal app and DMG
        run: |
          pnpm --filter @deskbrawl/desktop network:config https://api.deskbrawl.xyz
          pnpm --filter @deskbrawl/desktop tauri build --ci --target universal-apple-darwin --config src-tauri/tauri.network.conf.json -- --locked
          app=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/DeskBrawl.app
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DeskBrawl-macOS-universal
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
