name: Prepare desktop release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, alpha, beta, rc]
        default: stable
      retry_tag:
        description: Existing release tag to rebuild if draft creation failed
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source: ${{ steps.release.outputs.source }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # A queued release may start after another run has advanced main and created a tag.
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Calculate the version and release notes
        id: release
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'deskbrawl-release-notes.md'
          $result = node apps/desktop/scripts/release-version.mjs $env:RELEASE_CHANNEL $notes $env:RETRY_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $result | ConvertFrom-Json
          if (-not $release.version) {
            'No release-worthy changes since the previous stable release.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.tag)" >> $env:GITHUB_OUTPUT
          "source=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "prerelease=$($release.prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "DESKTOP_VERSION=$($release.version)" >> $env:GITHUB_ENV
          "RELEASE_TAG=$($release.tag)" >> $env:GITHUB_ENV
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV
          "PRERELEASE=$($release.prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Install dependencies and test the desktop app
        if: steps.release.outputs.version != ''
        shell: pwsh
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test apps/desktop/scripts/test-release-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $env:RETRY_TAG) {
            cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml -p deskbrawl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          pnpm --filter '@deskbrawl/desktop...' install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @deskbrawl/desktop test

      - name: Build the x64 installer
        if: steps.release.outputs.version != ''
        shell: pwsh
        run: |
          pnpm --filter @deskbrawl/desktop network:config https://api.deskbrawl.xyz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @deskbrawl/desktop tauri build --ci --config src-tauri/tauri.network.conf.json -- --locked

      - name: Prepare download assets
        if: steps.release.outputs.version != ''
        shell: pwsh
        run: |
          $bundle = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $installer = Join-Path $bundle "DeskBrawl_$($env:DESKTOP_VERSION)_x64-setup.exe"
          New-Item -ItemType Directory -Path release-assets,release-inputs -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath $installer -Destination release-assets/DeskBrawl_x64-setup.exe -ErrorAction Stop
          if ($env:PRERELEASE -eq 'false' -and (Test-Path -LiteralPath "$installer.sig")) {
            node apps/desktop/scripts/prepare-update.mjs $env:RELEASE_TAG $installer
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item -LiteralPath (Join-Path $bundle 'latest.json') -Destination release-assets/latest.json -ErrorAction Stop
          }
          Copy-Item -LiteralPath $env:RELEASE_NOTES -Destination release-inputs/release-notes.md -ErrorAction Stop
          git diff --binary --output=release-inputs/version.patch -- CHANGELOG.md apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.release.outputs.version != ''
        with:
          name: release-inputs
          path: release-inputs/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.release.outputs.version != ''
        with:
          name: windows-release-assets
          path: release-assets/
          if-no-files-found: error
          overwrite: true

  macos:
    needs: windows
    if: needs.windows.outputs.version != ''
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.windows.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-inputs
          path: release-inputs
      - name: Apply the prepared release version
        run: |
          if [ -s release-inputs/version.patch ]; then
            git apply release-inputs/version.patch
          fi
          test -f apps/desktop/src-tauri/tauri.macos.conf.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies and run native tests
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          pnpm --filter '@deskbrawl/desktop...' install --frozen-lockfile
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          pnpm --filter @deskbrawl/desktop network:config https://api.deskbrawl.xyz
      - name: Build and verify the signed universal DMG
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_CERTIFICATE:?Configure APPLE_CERTIFICATE}" "${APPLE_CERTIFICATE_PASSWORD:?Configure APPLE_CERTIFICATE_PASSWORD}" "${APPLE_SIGNING_IDENTITY:?Configure APPLE_SIGNING_IDENTITY}"
          : "${APPLE_ID:?Configure APPLE_ID}" "${APPLE_PASSWORD:?Configure APPLE_PASSWORD}" "${APPLE_TEAM_ID:?Configure APPLE_TEAM_ID}"
          pnpm --filter @deskbrawl/desktop tauri build --ci --target universal-apple-darwin --config src-tauri/tauri.network.conf.json -- --locked
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/DeskBrawl.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          installers=("$bundle"/dmg/*.dmg)
          test "${#installers[@]}" -eq 1
          cp "${installers[0]}" DeskBrawl_macOS-universal.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-assets
          path: DeskBrawl_macOS-universal.dmg
          if-no-files-found: error
          overwrite: true

  draft:
    needs: [windows, macos]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.windows.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Record the release and create a draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_TAG: ${{ inputs.retry_tag }}
          DESKTOP_VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_TAG: ${{ needs.windows.outputs.tag }}
          PRERELEASE: ${{ needs.windows.outputs.prerelease }}
        run: |
          $notes = 'artifacts/release-inputs/release-notes.md'
          $assets = @('artifacts/windows-release-assets/DeskBrawl_x64-setup.exe', 'artifacts/macos-release-assets/DeskBrawl_macOS-universal.dmg')
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          if (Test-Path -LiteralPath artifacts/windows-release-assets/latest.json) { $assets += 'artifacts/windows-release-assets/latest.json' }
          if (-not $env:RETRY_TAG) {
            git apply artifacts/release-inputs/version.patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh auth setup-git --hostname github.com
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- CHANGELOG.md apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git commit -m "chore(release): $($env:RELEASE_TAG)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git tag -a --cleanup=verbatim $env:RELEASE_TAG -F $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push --atomic origin 'HEAD:refs/heads/main' "refs/tags/$($env:RELEASE_TAG)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $options = @('--verify-tag', '--draft', '--notes-file', $notes, '--title', "DeskBrawl $($env:DESKTOP_VERSION)")
          if ($env:PRERELEASE -eq 'true') { $options += @('--prerelease', '--latest=false') }
          gh release create $env:RELEASE_TAG @assets @options
