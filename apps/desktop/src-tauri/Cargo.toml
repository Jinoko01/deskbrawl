[package]
name = "deskbrawl"
version = "0.1.0"
description = "DeskBrawl desktop application"
edition = "2021"
rust-version = "1.95"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
