<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>DeskBrawl 채팅</title></head>
  <body>
    <form class="chat-editor" aria-label="캐릭터 채팅">
      <div class="chat-keys"><span><kbd>Enter</kbd> 줄 넘기기</span><span><kbd>Esc</kbd> 닫기</span><span>50자</span></div>
      <p id="previous" class="truncate text-xs text-muted-foreground"></p>
      <input id="message" aria-label="채팅 내용, 입력 중 바로 공유" maxlength="50" autocomplete="off" class="w-full border-b border-control bg-card py-0.5 text-sm focus-visible:-outline-offset-2" placeholder="입력 중 바로 공유…" />
      <p id="status" class="text-xs text-muted-foreground" role="status">입력이 없으면 8초 뒤 닫혀요.</p>
    </form>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
